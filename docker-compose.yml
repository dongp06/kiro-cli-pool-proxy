services:
  kiro-pool-proxy:
    build: .
    image: kiro-pool-proxy:latest
    container_name: kiro-pool-proxy
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # config.json + persisted account usage counters live here.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
